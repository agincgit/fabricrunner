name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read   # gitleaks-action enumerates a PR's commits; without this it 403s

jobs:
  # Secrets first, and on their own job, so a leak fails the run even if the
  # build is broken. Do not assume platform secret scanning is enabled; this
  # control runs for every pull request and over the complete history.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: a secret removed in a later commit is still a leak
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Install Linux confinement test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3
      - name: Permit bubblewrap user namespaces on the CI host
        run: |
          sudo install -m 0644 .github/bwrap.apparmor /etc/apparmor.d/fabricrunner-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/fabricrunner-bwrap
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
